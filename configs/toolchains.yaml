# ISA → toolchain mapping for the deterministic BuildService (T008).
#
# The build node never hard-codes cross-compiler paths: it looks each ISA up
# here. An ISA absent from this file yields an error build cell (R8) rather than
# a crash, so the loop degrades gracefully on hosts missing a cross toolchain.
#
# Per ISA:
#   gcc_path     : (cross-)gcc executable
#   clang_path   : (cross-)clang executable for LLVM campaign targets
#   driver_args  : trusted compiler-wrapper arguments; optional
#   driver_args  : trusted wrapper arguments inserted before compiler flags; optional
#   prefix       : -B prefix for compiler components (cc1, as, ld); optional
#   sysroot      : --sysroot for cross builds; optional (native omits it)
#   cflags       : mechanism/ISA flags injected into every compile
#   qemu_path    : user-mode emulator or trusted QEMU wrapper; required when native=false
#   qemu_args    : trusted emulator arguments inserted before -L and the binary
#   qemu_sysroot : -L sysroot for QEMU
#   native       : true for the host ISA (run binaries directly, no QEMU)
#
# This checked-in file is a developer example, not a formal campaign config.
# For a one-host x86_64/aarch64/riscv64/loongarch64 campaign, copy
# `configs/toolchains.qemu.example.yaml`, replace every placeholder with an
# absolute executable/sysroot path, and select those four ISAs in the campaign.
# Formal preflight rejects an ambiguous execution mode and records compiler and
# QEMU identities in plan.json.
toolchains:
  aarch64:
    gcc_path: gcc
    cflags:
      - -O2
      - -D_FORTIFY_SOURCE=2
    native: true
