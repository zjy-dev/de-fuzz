# Formal experiment template for the paper-facing DeFuzz pipeline.
#
# This file is intentionally non-runnable until you replace every placeholder
# path with a frozen environment-specific value and populate the credential
# environment variable named by the local HTTP config.
# It stays in mode=formal, so the launcher will fail closed instead of falling
# back to the fixture runners used by configs/experiments/example.yaml.
# The companion http-agent.example.yaml pins Terra Max at medium reasoning; copy
# or replace its path as needed, but never put an API key value in either YAML.
#
# Validate without writes:
#   cd orchestrator
#   uv run defuzz-experiment pipeline --config ../configs/experiments/formal.example.yaml --show-plan
#
# Execute after replacing placeholders:
#   cd orchestrator
#   uv run defuzz-experiment pipeline --config ../configs/experiments/formal.example.yaml
schema_version: 1
run_id: formal-gcc17-20260531-canary-campaign
mode: formal
output_root: ../../orchestrator/runs/pipelines
repetitions: 3
variants: [full, without-rag, without-oracle, bare-agent]

backend:
  kind: http
  # Replace this path if the copied local config lives elsewhere.
  config_path: ./http-agent.example.yaml

budgets:
  part_i:
    token_budget: 2000000
    time_budget_minutes: 480
  part_ii:
    token_budget: 2000000
    time_budget_minutes: 720
  part_iii:
    token_budget: 1000000
    time_budget_minutes: 480

generation:
  path: combined
  reference_root: /ABS/PATH/TO/defend-reviewer/main
  document_roots: []
  max_segments: null
  shard_index: 0
  shard_count: 1

toolchains_config: /ABS/PATH/TO/de-fuzz/main/configs/toolchains.formal.yaml

targets:
  # Freeze the source checkout at f20bc4c2fe00928013c533e241b89ae3a6724ca1.
  - id: gcc17-20260531-canary
    compiler: gcc
    version: "17.0.0 experimental 20260531 (commit f20bc4c2fe00928013c533e241b89ae3a6724ca1)"
    corpus_root: /ABS/PATH/TO/gcc-f20bc4c2fe00928013c533e241b89ae3a6724ca1/source/for/part1
    audit_source_roots:
      - /ABS/PATH/TO/gcc-f20bc4c2fe00928013c533e241b89ae3a6724ca1/source/for/part3
    mechanisms:
      - canary
    isas:
      - x86_64

checker:
  source_root: /ABS/PATH/TO/de-fuzz/main
  checker_root: core/internal/oracle
  max_attempts: 3

audit:
  max_concurrency: 1
  oracle_rounds: 1
  demo_parity: false
  parity_profile: demo-workset
  parity_threshold: null
  parity_threshold_metric: recall
  require_verified_candidates: true
