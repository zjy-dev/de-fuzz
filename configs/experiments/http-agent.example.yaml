# Secret-free configuration for DeFuzz's direct HTTP Responses backend.
#
# The formal pipeline reads this YAML (JSON is also accepted) and calls
# {base_url}/responses itself. It does not launch OpenCode or another agent CLI.
# Keep the credential value out of this file: api_key_env names the process
# environment variable that must be populated before preflight or execution.
http_agent:
  base_url: http://127.0.0.1:8787/v1
  model: coconut-gpt-5-6-terra-max
  api_key_env: DEFUZZ_COCONUT_API_KEY
  reasoning_effort: medium
  timeout: 1200
  max_output_tokens: 12000
  max_retries: 3
  retry_backoff_seconds: 0.5
  max_tool_rounds: 48
  max_schema_retries: 2
  # store=false keeps provider-side state disabled; resend the complete tool
  # transcript on each round instead of relying on server-stored response IDs.
  continuation_mode: full_input
  # Compatibility header for this local gateway; it does not select a runner.
  user_agent: codex-cli/1.0
