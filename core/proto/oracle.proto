// gRPC contract: 确定性节点 (build / coverage / oracle)
// 由 Python 编排器同步调用；Go 侧 internal/service/grpc_server.go 实现，
// 复用 internal/compiler、internal/coverage、internal/oracle，不改裁决逻辑。
//
// 设计要点：
// - 这三个 service 是确定性节点，绝不调用 agent。
// - CheckerMetadataService 暴露 SSOT 元数据只读视图，gRPC 与 MCP 共读同一份
//   internal/oracle/metadata.go。
// - 覆盖率只在 CoverageService.Measure 强制测出。

syntax = "proto3";

package defuzz.core.v1;

option go_package = "github.com/zjy-dev/de-fuzz/internal/service/pb;pb";

// ── 公共类型 ──────────────────────────────────────────────

message Seed {
  string id = 1;
  string source = 2;                 // C 源码
  string parent_id = 3;
  repeated string selected_checkers = 4; // checker ID 集（不含 ISA, FR-013）
}

enum Verdict {                        // 对齐 internal/oracle/invariant.go 四态
  VERDICT_PASS = 0;
  VERDICT_FAIL = 1;
  VERDICT_NOT_APPLICABLE = 2;
  VERDICT_ERROR = 3;
}

message InvariantResult {
  string id = 1;                     // 如 INV-SP-L01
  string category = 2;               // static | dynamic
  Verdict verdict = 3;
  string evidence = 4;               // 人读
  map<string, string> detail = 5;    // 机读
  string reason = 6;                 // 仅 NA / Error
  string isa = 7;                    // 该结果对应的 ISA
}

// ── BuildService ─────────────────────────────────────────
// 按 (checker→ISA) 矩阵编译；矩阵由 Python routing.py 查表展开后传入。

message BuildCell {
  string checker_id = 1;
  string isa = 2;
}

message BuildRequest {
  Seed seed = 1;
  repeated BuildCell cells = 2;      // 已展开的编译矩阵
}

message BuildArtifact {
  BuildCell cell = 1;
  string binary_path = 2;
  bool success = 3;
  string error = 4;                  // 编译失败时填（R8：跳过后续, 不崩溃）
}

message BuildResponse {
  repeated BuildArtifact artifacts = 1;
}

service BuildService {
  rpc Build(BuildRequest) returns (BuildResponse);
}

// ── CoverageService ──────────────────────────────────────
// 强制测量（FR-022）；返回累积 + 本轮增量，写回 blackboard。

message CoverageRequest {
  repeated BuildArtifact artifacts = 1;
  bytes cumulative_state = 2;        // 传入上轮累积（编排器从 state 取）
}

message CoverageResponse {
  bytes cumulative_state = 1;        // 更新后累积
  string delta_json = 2;             // 本轮增量（反馈 agent 只读 diff, R6）
}

service CoverageService {
  rpc Measure(CoverageRequest) returns (CoverageResponse);
}

// ── OracleService ────────────────────────────────────────
// 跑 checker 得 verdict；复用 MechanismOracle，零假阳性逻辑不动。

message OracleRequest {
  Seed seed = 1;
  repeated BuildArtifact artifacts = 2;
}

message OracleResponse {
  repeated InvariantResult results = 1;
  bool violated = 2;                 // 任一 Fail → true（FR-021, R8）
  // 违反时附确定性证据，供最小化分支（FR-025）
  string failing_checker = 3;
  string failing_isa = 4;
  string evidence = 5;
}

service OracleService {
  rpc Analyze(OracleRequest) returns (OracleResponse);
}

// ── CheckerMetadataService ───────────────────────────────
// SSOT 只读视图（research R4）。Python routing.py 启动时拉取并缓存，
// 用于 checker→ISA 查表 + cheap/expensive 分流。

message CheckerMetadata {
  string id = 1;
  repeated string applicable_isas = 2;
  string mode = 3;                   // single | differential
  string cost = 4;                   // cheap | expensive
  string category = 5;               // static | dynamic
}

message ListCheckerMetadataRequest {}

message ListCheckerMetadataResponse {
  repeated CheckerMetadata checkers = 1;
}

service CheckerMetadataService {
  rpc ListCheckerMetadata(ListCheckerMetadataRequest) returns (ListCheckerMetadataResponse);
}
