[project]
name = "defuzz-loop"
version = "0.1.0"
description = "DeFuzz Python orchestration with isolated Pi SDK agents over a blackboard."
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "jsonschema>=4.0",
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# LLM providers are reached through the locked Node Pi SDK worker.
# No provider SDK is a hard dependency of the orchestrator itself.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
defuzz-loop = "defuzz_loop.cli:main"
defuzz-experiment = "defuzz_loop.experiments_cli:main"
defuzz-full-experiment = "defuzz_loop.full_experiment:main"
defuzz-inspect-attempt = "defuzz_loop.agents.trace:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Generated protobuf stubs are not linted.
exclude = ["defuzz_loop/clients/pb/**"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ['defuzz_loop/clients/pb/.*']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["defuzz_loop"]
