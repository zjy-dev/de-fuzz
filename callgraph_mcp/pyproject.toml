[project]
name = "defuzz-callgraph-mcp"
version = "0.1.0"
description = "CSV-backed callgraph MCP for DeFuzz"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
defuzz-callgraph-ingest = "defuzz_callgraph.ingest:main"
defuzz-callgraph-mcp = "defuzz_callgraph.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defuzz_callgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
