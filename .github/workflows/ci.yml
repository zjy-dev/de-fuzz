name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep this name stable for existing branch-protection rules.
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify Go dependencies
        working-directory: core
        run: |
          go mod download
          go mod verify

      - name: Check Go formatting
        working-directory: core
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go vet
        working-directory: core
        run: go vet ./...

      - name: Run Go tests
        working-directory: core
        run: go test -short -race ./...

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json

      - name: Install agent isolation and search tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep fd-find

      - name: Build and verify Pi worker
        working-directory: agent-runtime
        run: npm ci --no-audit --no-fund && npm test

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: orchestrator/uv.lock

      - name: Install Python dependencies
        working-directory: orchestrator
        run: uv sync --locked --dev --python 3.12

      - name: Run Python lint
        working-directory: orchestrator
        run: uv run ruff check defuzz_loop tests

      - name: Run Python type checks
        working-directory: orchestrator
        run: uv run mypy defuzz_loop

      - name: Run Python tests
        working-directory: orchestrator
        run: uv run pytest -q

      - name: Build Python package
        working-directory: orchestrator
        run: uv build
